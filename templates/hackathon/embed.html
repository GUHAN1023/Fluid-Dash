<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOGFOOD Showcase Widget</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    body { background: transparent; padding: 12px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .widget-container { background: #FFFFFF; border: 1px solid var(--color-border); border-radius: var(--radius-xl); padding: 16px; box-shadow: var(--shadow-sm); }
    .widget-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; }
    .widget-card { border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 12px; background: var(--color-canvas); }
  </style>
</head>
<body>
  <div class="widget-container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="font-weight: 700; font-size: 0.95rem; color: var(--color-text-title);">🐕 DOGFOOD Showcase (T4 Embed)</div>
      <a href="/hackathon/gallery.html" target="_blank" style="font-size: 0.75rem; color: var(--color-primary); text-decoration: none; font-weight: 600;">View Full Gallery (41) →</a>
    </div>
    <div class="widget-grid">
      {% for p in projects %}
      <div class="widget-card">
        <span class="badge badge-track" style="font-size: 0.65rem;">{{ p.track_name }}</span>
        <div style="font-weight: 600; font-size: 0.875rem; margin-top: 4px; color: var(--color-text-title);">{{ p.title }}</div>
        <div style="font-size: 0.75rem; color: var(--color-text-muted);">{{ p.team_name }}</div>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
